[project]
name = "job-assistant"
version = "0.1.0"
description = "Command line core for the job assistant."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
